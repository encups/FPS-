<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Control Center - Outbound Engine</title>

    <!--
    ============================================
    HOW TO USE:
    ============================================
    1. Double-click this file to open in Chrome (or any modern browser)
    2. On first run, the app will seed sample data (3 clients, 100+ events)
    3. Navigate using the top menu: Overview, Clients, Events, Flow, etc.
    4. Add clients, track events, view KPIs
    5. Click a client to see details and get a shareable link
    6. Share links work like: index.html#share=TOKEN (client-facing view)
    7. To reset data: scroll to footer and click "Reset Seed Data"

    FEATURES:
    - Overview: Global + per-client KPIs with charts
    - Clients: Manage client list and campaign settings
    - Client Detail: View/edit settings, generate share link
    - Events: Full event log with filters
    - Flow Diagram: Visual workflow representation
    - Share View: Client-facing read-only dashboard

    All data is stored in your browser's localStorage.
    ============================================
    -->

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--gray-50);
            color: var(--gray-900);
            line-height: 1.6;
        }

        /* Header */
        header {
            background: white;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 30px;
            height: 60px;
        }

        .logo {
            font-weight: 700;
            font-size: 18px;
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
            flex: 1;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--gray-600);
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--primary);
            background: var(--gray-100);
        }

        /* Main Container */
        main {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Cards */
        .card {
            background: white;
            border-radius: 8px;
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--gray-900);
        }

        /* Grid */
        .grid {
            display: grid;
            gap: 20px;
        }

        .grid-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        .grid-3 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
        .grid-4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }

        /* KPI Card */
        .kpi-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--primary);
        }

        .kpi-label {
            font-size: 13px;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .kpi-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--gray-900);
            margin: 8px 0;
        }

        .kpi-subtext {
            font-size: 14px;
            color: var(--gray-600);
        }

        /* Buttons */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--gray-200);
            color: var(--gray-700);
        }

        .btn-secondary:hover {
            background: var(--gray-300);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--gray-50);
        }

        th {
            text-align: left;
            padding: 12px;
            font-weight: 600;
            color: var(--gray-700);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px;
            border-top: 1px solid var(--gray-200);
        }

        tbody tr:hover {
            background: var(--gray-50);
        }

        /* Badge */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-active {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-paused {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-success {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-info {
            background: #dbeafe;
            color: #1e40af;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 600;
        }

        /* Form */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--gray-700);
            font-size: 14px;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--gray-300);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-checkbox {
            margin-right: 8px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--gray-200);
        }

        .tab {
            padding: 10px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 500;
            color: var(--gray-600);
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* Chart */
        .chart-container {
            position: relative;
            height: 300px;
            margin: 20px 0;
        }

        canvas {
            max-width: 100%;
        }

        /* Flow Diagram */
        .flow-diagram {
            padding: 40px 20px;
            overflow-x: auto;
        }

        .flow-steps {
            display: flex;
            align-items: center;
            gap: 20px;
            min-width: max-content;
        }

        .flow-step {
            background: white;
            border: 2px solid var(--primary);
            border-radius: 8px;
            padding: 20px 30px;
            min-width: 140px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .flow-step:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .flow-step-title {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .flow-step-desc {
            font-size: 12px;
            color: var(--gray-600);
        }

        .flow-arrow {
            color: var(--gray-400);
            font-size: 24px;
        }

        /* Utility */
        .hidden {
            display: none !important;
        }

        .text-center {
            text-align: center;
        }

        .text-muted {
            color: var(--gray-500);
        }

        .mb-20 {
            margin-bottom: 20px;
        }

        .mt-20 {
            margin-top: 20px;
        }

        .flex {
            display: flex;
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .flex-gap {
            gap: 10px;
        }

        .clickable {
            cursor: pointer;
        }

        .clickable:hover {
            text-decoration: underline;
        }

        /* Footer */
        footer {
            max-width: 1400px;
            margin: 60px auto 20px;
            padding: 20px;
            text-align: center;
            color: var(--gray-500);
            font-size: 14px;
        }

        /* Share View Specific */
        .share-view {
            max-width: 900px;
            margin: 0 auto;
        }

        .share-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 40px 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
        }

        .share-client-name {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .share-subtitle {
            font-size: 16px;
            opacity: 0.9;
        }

        /* Print Styles */
        @media print {
            header, footer, .no-print {
                display: none !important;
            }

            body {
                background: white;
            }

            .card {
                box-shadow: none;
                border: 1px solid var(--gray-300);
                page-break-inside: avoid;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-links {
                gap: 10px;
                font-size: 14px;
            }

            .grid-2,
            .grid-3,
            .grid-4 {
                grid-template-columns: 1fr;
            }

            .flow-steps {
                flex-direction: column;
            }

            .flow-arrow {
                transform: rotate(90deg);
            }
        }
    </style>
</head>
<body>
    <header id="header">
        <nav>
            <div class="logo">⚡ Control Center</div>
            <ul class="nav-links" id="nav-links">
                <li><a href="#overview" data-nav="overview">Overview</a></li>
                <li><a href="#clients" data-nav="clients">Clients</a></li>
                <li><a href="#events" data-nav="events">Events</a></li>
                <li><a href="#flow" data-nav="flow">Flow</a></li>
            </ul>
        </nav>
    </header>

    <main id="app">
        <!-- Content will be rendered here by JavaScript -->
    </main>

    <footer id="footer">
        <p>Service-First Outbound Engine Control Center</p>
        <button class="btn btn-danger btn-sm mt-20" onclick="resetSeedData()">Reset Seed Data</button>
    </footer>

    <!-- Modals -->
    <div id="modal-container"></div>

    <script>
        // ============================================
        // UTILITY FUNCTIONS
        // ============================================

        function uuid() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        function randomToken() {
            return Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
        }

        function formatDate(date) {
            if (typeof date === 'string') date = new Date(date);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function formatDateTime(date) {
            if (typeof date === 'string') date = new Date(date);
            return date.toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric',
                hour: 'numeric',
                minute: '2-digit'
            });
        }

        function getRangeDates(days) {
            const end = new Date();
            const start = new Date();
            start.setDate(start.getDate() - days);
            return { start, end };
        }

        function filterEventsByRange(events, days) {
            const { start } = getRangeDates(days);
            return events.filter(e => new Date(e.timestamp) >= start);
        }

        function computeMetrics(events) {
            const sends = events.filter(e => e.type === 'EmailSent').length;
            const positiveReplies = events.filter(e => e.type === 'ReplyPositive').length;
            const neutralReplies = events.filter(e => e.type === 'ReplyNeutral').length;
            const negativeReplies = events.filter(e => e.type === 'ReplyNegative').length;
            const replies = positiveReplies + neutralReplies + negativeReplies;
            const calls = events.filter(e => e.type === 'CallBooked').length;

            const replyRate = sends > 0 ? (replies / sends * 100).toFixed(1) : '0.0';
            const bookingRateFromPositive = positiveReplies > 0 ? (calls / positiveReplies * 100).toFixed(1) : '0.0';
            const bookingRateFromSends = sends > 0 ? (calls / sends * 100).toFixed(1) : '0.0';

            return {
                sends,
                replies,
                positiveReplies,
                neutralReplies,
                negativeReplies,
                calls,
                replyRate,
                bookingRateFromPositive,
                bookingRateFromSends
            };
        }

        // ============================================
        // DATA LAYER
        // ============================================

        const DB = {
            getClients() {
                const data = localStorage.getItem('clients');
                return data ? JSON.parse(data) : [];
            },

            saveClients(clients) {
                localStorage.setItem('clients', JSON.stringify(clients));
            },

            getClient(id) {
                return this.getClients().find(c => c.id === id);
            },

            getClientByToken(token) {
                return this.getClients().find(c => c.shareToken === token);
            },

            addClient(client) {
                const clients = this.getClients();
                clients.push({
                    id: uuid(),
                    shareToken: randomToken(),
                    createdAt: new Date().toISOString(),
                    status: 'Active',
                    campaignSettings: {
                        dailySends: 50,
                        inboxCount: 3,
                        followUpCount: 3,
                        stopOnReply: true,
                        exclusions: ''
                    },
                    ...client
                });
                this.saveClients(clients);
            },

            updateClient(id, updates) {
                const clients = this.getClients();
                const index = clients.findIndex(c => c.id === id);
                if (index !== -1) {
                    clients[index] = { ...clients[index], ...updates };
                    this.saveClients(clients);
                }
            },

            getEvents() {
                const data = localStorage.getItem('events');
                return data ? JSON.parse(data) : [];
            },

            saveEvents(events) {
                localStorage.setItem('events', JSON.stringify(events));
            },

            addEvent(event) {
                const events = this.getEvents();
                events.push({
                    id: uuid(),
                    timestamp: new Date().toISOString(),
                    ...event
                });
                events.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                this.saveEvents(events);
            },

            deleteEvent(id) {
                const events = this.getEvents().filter(e => e.id !== id);
                this.saveEvents(events);
            },

            getClientEvents(clientId, days = null) {
                let events = this.getEvents().filter(e => e.clientId === clientId);
                if (days) events = filterEventsByRange(events, days);
                return events;
            }
        };

        // ============================================
        // SEED DATA
        // ============================================

        function seedDataIfEmpty() {
            if (DB.getClients().length > 0) return;

            // Create 3 clients
            const clients = [
                {
                    name: 'Acme Corp',
                    icpNotes: 'B2B SaaS companies, 50-200 employees',
                    offerNotes: 'Lead generation audit + strategy call',
                    calendarUrl: 'https://cal.com/demo',
                    geo: 'USA',
                    dealSize: '$5,000/mo'
                },
                {
                    name: 'TechStart Inc',
                    icpNotes: 'Early-stage startups in fintech',
                    offerNotes: 'Free growth consultation',
                    calendarUrl: 'https://calendly.com/demo',
                    geo: 'UK',
                    dealSize: '$3,000/mo'
                },
                {
                    name: 'GlobalSales Ltd',
                    icpNotes: 'Enterprise sales teams, 200+ headcount',
                    offerNotes: 'Sales enablement workshop',
                    calendarUrl: 'https://cal.com/demo2',
                    geo: 'Canada',
                    dealSize: '$10,000/mo'
                }
            ];

            clients.forEach(c => DB.addClient(c));

            // Create 100+ events over the past 30 days
            const clientIds = DB.getClients().map(c => c.id);
            const eventTypes = ['LeadsImported', 'EmailSent', 'EmailSent', 'EmailSent', 'EmailSent', 'ReplyPositive', 'ReplyNeutral', 'ReplyNegative', 'CallBooked'];
            const events = [];

            for (let i = 0; i < 150; i++) {
                const daysAgo = Math.floor(Math.random() * 30);
                const date = new Date();
                date.setDate(date.getDate() - daysAgo);
                date.setHours(Math.floor(Math.random() * 24), Math.floor(Math.random() * 60));

                const type = eventTypes[Math.floor(Math.random() * eventTypes.length)];
                const clientId = clientIds[Math.floor(Math.random() * clientIds.length)];

                events.push({
                    id: uuid(),
                    clientId,
                    type,
                    timestamp: date.toISOString(),
                    meta: type === 'CallBooked' ? 'Call scheduled for next week' :
                          type === 'LeadsImported' ? `${Math.floor(Math.random() * 500 + 100)} leads imported` :
                          type.startsWith('Reply') ? 'Reply from prospect' :
                          'Automated send'
                });
            }

            DB.saveEvents(events);
        }

        function resetSeedData() {
            if (confirm('Are you sure? This will delete all data and reset to seed data.')) {
                localStorage.clear();
                seedDataIfEmpty();
                location.hash = '#overview';
                location.reload();
            }
        }

        // ============================================
        // ROUTING
        // ============================================

        const Router = {
            currentRoute: '',

            init() {
                window.addEventListener('hashchange', () => this.handleRoute());
                this.handleRoute();
            },

            handleRoute() {
                const hash = location.hash.slice(1) || 'overview';
                const [route, param] = hash.split('=');

                this.currentRoute = route;
                this.updateNav(route);

                if (route === 'share' && param) {
                    renderShareView(param);
                } else if (route === 'client' && param) {
                    renderClientDetail(param);
                } else {
                    this.renderView(route);
                }
            },

            updateNav(route) {
                document.querySelectorAll('.nav-links a').forEach(a => {
                    a.classList.toggle('active', a.dataset.nav === route);
                });

                // Hide navigation in share view
                const header = document.getElementById('header');
                const footer = document.getElementById('footer');
                if (route === 'share') {
                    header.classList.add('hidden');
                    footer.classList.add('hidden');
                } else {
                    header.classList.remove('hidden');
                    footer.classList.remove('hidden');
                }
            },

            renderView(route) {
                const app = document.getElementById('app');

                switch(route) {
                    case 'overview':
                        renderOverview();
                        break;
                    case 'clients':
                        renderClients();
                        break;
                    case 'events':
                        renderEvents();
                        break;
                    case 'flow':
                        renderFlow();
                        break;
                    default:
                        renderOverview();
                }
            }
        };

        // ============================================
        // VIEWS
        // ============================================

        function renderOverview() {
            const app = document.getElementById('app');
            const clients = DB.getClients();
            const events = DB.getEvents();

            // Default to 7 days
            let rangeDays = 7;

            const render = (days) => {
                rangeDays = days;
                const rangeEvents = filterEventsByRange(events, days);
                const metrics = computeMetrics(rangeEvents);

                const clientMetrics = clients.map(client => {
                    const clientEvents = filterEventsByRange(DB.getClientEvents(client.id), days);
                    const m = computeMetrics(clientEvents);
                    return { client, metrics: m };
                }).sort((a, b) => b.metrics.calls - a.metrics.calls);

                app.innerHTML = `
                    <div class="card">
                        <div class="card-header">
                            <h1 class="card-title">Dashboard Overview</h1>
                            <div class="tabs">
                                <button class="tab ${days === 7 ? 'active' : ''}" onclick="overviewChangeRange(7)">Last 7 Days</button>
                                <button class="tab ${days === 30 ? 'active' : ''}" onclick="overviewChangeRange(30)">Last 30 Days</button>
                            </div>
                        </div>

                        <div class="grid grid-4">
                            <div class="kpi-card">
                                <div class="kpi-label">Total Sends</div>
                                <div class="kpi-value">${metrics.sends.toLocaleString()}</div>
                            </div>
                            <div class="kpi-card" style="border-left-color: var(--success)">
                                <div class="kpi-label">Total Replies</div>
                                <div class="kpi-value">${metrics.replies}</div>
                                <div class="kpi-subtext">${metrics.replyRate}% reply rate</div>
                            </div>
                            <div class="kpi-card" style="border-left-color: var(--warning)">
                                <div class="kpi-label">Positive Replies</div>
                                <div class="kpi-value">${metrics.positiveReplies}</div>
                            </div>
                            <div class="kpi-card" style="border-left-color: var(--danger)">
                                <div class="kpi-label">Booked Calls</div>
                                <div class="kpi-value">${metrics.calls}</div>
                                <div class="kpi-subtext">${metrics.bookingRateFromPositive}% from positive</div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-title">Activity Over Time</h2>
                        </div>
                        <div class="chart-container">
                            <canvas id="overview-chart"></canvas>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-title">Client Performance</h2>
                        </div>
                        <div class="grid grid-3">

        // ============================================
        // CHART RENDERING
        // ============================================

        function renderTimeSeriesChart(canvasId, events, days) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            const width = canvas.parentElement.clientWidth;
            const height = 300;
            canvas.width = width;
            canvas.height = height;

            // Group events by day
            const dateMap = {};
            const { start } = getRangeDates(days);

            for (let i = 0; i < days; i++) {
                const d = new Date(start);
                d.setDate(d.getDate() + i);
                const key = d.toISOString().split('T')[0];
                dateMap[key] = { sends: 0, replies: 0, calls: 0 };
            }

            events.forEach(e => {
                const key = e.timestamp.split('T')[0];
                if (dateMap[key]) {
                    if (e.type === 'EmailSent') dateMap[key].sends++;
                    if (e.type.startsWith('Reply')) dateMap[key].replies++;
                    if (e.type === 'CallBooked') dateMap[key].calls++;
                }
            });

            const dates = Object.keys(dateMap).sort();
            const sends = dates.map(d => dateMap[d].sends);
            const replies = dates.map(d => dateMap[d].replies);
            const calls = dates.map(d => dateMap[d].calls);

            const maxValue = Math.max(...sends, ...replies, ...calls, 1);

            // Clear canvas
            ctx.clearRect(0, 0, width, height);

            // Draw grid
            ctx.strokeStyle = '#e5e7eb';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 5; i++) {
                const y = (height - 40) * (i / 5) + 20;
                ctx.beginPath();
                ctx.moveTo(40, y);
                ctx.lineTo(width - 20, y);
                ctx.stroke();

                ctx.fillStyle = '#6b7280';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(Math.round(maxValue * (1 - i / 5)), 35, y + 4);
            }

            // Draw lines
            const pointSpacing = (width - 60) / (dates.length - 1 || 1);

            const drawLine = (data, color) => {
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.beginPath();

                data.forEach((value, i) => {
                    const x = 40 + i * pointSpacing;
                    const y = height - 40 - (value / maxValue) * (height - 60);

                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });

                ctx.stroke();

                // Draw points
                ctx.fillStyle = color;
                data.forEach((value, i) => {
                    const x = 40 + i * pointSpacing;
                    const y = height - 40 - (value / maxValue) * (height - 60);
                    ctx.beginPath();
                    ctx.arc(x, y, 3, 0, Math.PI * 2);
                    ctx.fill();
                });
            };

            drawLine(sends, '#2563eb');
            drawLine(replies, '#10b981');
            drawLine(calls, '#ef4444');

            // Legend
            const legendY = height - 15;
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'left';

            ctx.fillStyle = '#2563eb';
            ctx.fillRect(40, legendY, 12, 12);
            ctx.fillStyle = '#1f2937';
            ctx.fillText('Sends', 56, legendY + 10);

            ctx.fillStyle = '#10b981';
            ctx.fillRect(120, legendY, 12, 12);
            ctx.fillStyle = '#1f2937';
            ctx.fillText('Replies', 136, legendY + 10);

            ctx.fillStyle = '#ef4444';
            ctx.fillRect(200, legendY, 12, 12);
            ctx.fillStyle = '#1f2937';
            ctx.fillText('Calls', 216, legendY + 10);
        }

            const client = DB.getClient(clientId);
            const s = client.campaignSettings;

            openModal('Edit Campaign Settings', `
                <div class="form-group">
                    <label class="form-label">Daily Sends</label>
                    <input type="number" name="dailySends" class="form-input" value="${s.dailySends}">
                </div>
                <div class="form-group">
                    <label class="form-label">Inbox Count</label>
                    <input type="number" name="inboxCount" class="form-input" value="${s.inboxCount}">
                </div>
                <div class="form-group">
                    <label class="form-label">Follow-up Count</label>
                    <input type="number" name="followUpCount" class="form-input" value="${s.followUpCount}">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" name="stopOnReply" class="form-checkbox" ${s.stopOnReply ? 'checked' : ''}>
                        Stop on Reply
                    </label>
                </div>
                <div class="form-group">
                    <label class="form-label">Exclusions (comma-separated)</label>
                    <textarea name="exclusions" class="form-textarea">${s.exclusions}</textarea>
                </div>
            `, (formData) => {
                DB.updateClient(clientId, {
                    campaignSettings: {
                        dailySends: parseInt(formData.get('dailySends')),
                        inboxCount: parseInt(formData.get('inboxCount')),
                        followUpCount: parseInt(formData.get('followUpCount')),
                        stopOnReply: formData.get('stopOnReply') === 'on',
                        exclusions: formData.get('exclusions')
                    }
                });
                location.hash = `client=${clientId}`;
            });
        };

        window.openAddEventModal = (clientId = '') => {
            const clients = DB.getClients();

            openModal('Add Event', `
                <div class="form-group">
                    <label class="form-label">Client *</label>
                    <select name="clientId" class="form-select" required>
                        <option value="">Select client...</option>
                        ${clients.map(c => `
                            <option value="${c.id}" ${c.id === clientId ? 'selected' : ''}>${c.name}</option>
                        `).join('')}
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Event Type *</label>
                    <select name="type" class="form-select" required>
                        <option value="LeadsImported">Leads Imported</option>
                        <option value="EmailSent">Email Sent</option>
                        <option value="ReplyPositive">Reply Positive</option>
                        <option value="ReplyNeutral">Reply Neutral</option>
                        <option value="ReplyNegative">Reply Negative</option>
                        <option value="CallBooked">Call Booked</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Timestamp</label>
                    <input type="datetime-local" name="timestamp" class="form-input" value="${new Date().toISOString().slice(0, 16)}">
                </div>
                <div class="form-group">
                    <label class="form-label">Details</label>
                    <textarea name="meta" class="form-textarea"></textarea>
                </div>
            `, (formData) => {
                DB.addEvent({
                    clientId: formData.get('clientId'),
                    type: formData.get('type'),
                    timestamp: formData.get('timestamp') ? new Date(formData.get('timestamp')).toISOString() : new Date().toISOString(),
                    meta: formData.get('meta')
                });

                if (clientId) {
                    location.hash = `client=${clientId}`;
                } else {
                    location.hash = 'events';
                }
            });
        };

        // ============================================
        // ACTION FUNCTIONS
        // ============================================

        window.toggleClientStatus = (clientId) => {
            const client = DB.getClient(clientId);
            const newStatus = client.status === 'Active' ? 'Paused' : 'Active';
            DB.updateClient(clientId, { status: newStatus });
            location.hash = `client=${clientId}`;
        };

        window.copyShareLink = (clientId) => {
            const input = document.getElementById(`share-url-${clientId}`);
            input.select();
            document.execCommand('copy');
            alert('Share link copied to clipboard!');
        };

        window.generateWeeklySummary = (clientId) => {
            const client = DB.getClient(clientId);
            const events7d = filterEventsByRange(DB.getClientEvents(clientId), 7);
            const metrics = computeMetrics(events7d);

            const summary = `
                <div style="background: var(--gray-50); padding: 20px; border-radius: 8px; margin-top: 10px;">
                    <h3>Weekly Performance Summary - ${client.name}</h3>
                    <p><strong>Period:</strong> ${formatDate(getRangeDates(7).start)} - ${formatDate(new Date())}</p>

                    <h4 style="margin-top: 20px;">Key Metrics:</h4>
                    <ul>
                        <li><strong>${metrics.sends}</strong> emails sent to qualified prospects</li>
                        <li><strong>${metrics.replies}</strong> total replies received (${metrics.replyRate}% reply rate)</li>
                        <li><strong>${metrics.positiveReplies}</strong> positive/interested responses</li>
                        <li><strong>${metrics.calls}</strong> calls booked on your calendar</li>
                    </ul>

                    <h4 style="margin-top: 20px;">Insights:</h4>
                    <p>
                        ${metrics.calls > 0 ?
                            `Great week! We successfully booked ${metrics.calls} qualified call${metrics.calls > 1 ? 's' : ''} for you. ` :
                            `We're actively reaching out and tracking responses. `}
                        ${metrics.replyRate > 5 ?
                            `Your ${metrics.replyRate}% reply rate is strong and above industry average. ` :
                            `We're optimizing messaging to improve engagement. `}
                        Campaign is running on ${client.campaignSettings.dailySends} sends per day across ${client.campaignSettings.inboxCount} inboxes.
                    </p>

                    <h4 style="margin-top: 20px;">Next Steps:</h4>
                    <ul>
                        <li>Continue monitoring reply quality and adjusting messaging</li>
                        <li>Prepare for scheduled calls and follow-ups</li>
                        <li>Review and update ICP based on response patterns</li>
                    </ul>
                </div>
            `;

            document.getElementById(`weekly-summary-${clientId}`).innerHTML = summary;
        };

        // ============================================
        // INITIALIZATION
        // ============================================

        document.addEventListener('DOMContentLoaded', () => {
            seedDataIfEmpty();
            Router.init();
        });
    </script>
</body>
</html>
